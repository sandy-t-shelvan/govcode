# Low-side CI. Every job must pass before a PR can merge (see CONTRIBUTING.md).
# The high side builds with scripts/build-release.sh and the same toolchain.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.4"
  STATICCHECK_VERSION: "v0.8.2"
  GOVULNCHECK_VERSION: "v1.9.0"
  COVERAGE_FLOOR: "52"
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: no third-party modules
        run: |
          ! grep -qE '^\s*require' go.mod
          test ! -e go.sum

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: govulncheck (standard library and toolchain)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          "$(go env GOPATH)/bin/govulncheck" ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: legacy toolchains for the eval tasks, and bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnat gnucobol bubblewrap softhsm2 opensc
      - name: allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: tests with race detector and coverage floor
        env: { GOPROXY: "off", GOFLAGS: "-mod=readonly" }
        run: scripts/ci/coverage.sh "$COVERAGE_FLOOR"

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: fuzz every target (30s each)
        run: scripts/ci/fuzz.sh 30
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: fuzz-crashers, path: "**/testdata/fuzz/**" }

  vscode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: allow unprivileged user namespaces (bubblewrap)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - name: zero npm dependencies
        run: node -e "const p=require('./vscode/package.json'); if (p.dependencies||p.devDependencies) { console.error('npm dependencies are not allowed'); process.exit(1) }"
      - name: extension tests (unit + against the real govcode binary)
        run: |
          go build -o "$RUNNER_TEMP/govcode" ./cmd/govcode
          cd vscode && GOVCODE_BIN="$RUNNER_TEMP/govcode" node --test test/*.test.js
      - name: reproducible VSIX
        run: |
          scripts/package-vsix.sh "$RUNNER_TEMP/a.vsix"
          scripts/package-vsix.sh "$RUNNER_TEMP/b.vsix"
          cmp "$RUNNER_TEMP/a.vsix" "$RUNNER_TEMP/b.vsix"

  release:
    runs-on: ubuntu-24.04
    needs: [lint, security, test, vscode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: toolchains (release script runs the test suite)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnat gnucobol bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - name: reproducible, signed release build
        run: |
          go run ./cmd/govcode keygen -o "$RUNNER_TEMP/ci-release.key"
          scripts/build-release.sh ci "$RUNNER_TEMP/ci-release.key"
      - name: verify build provenance and SBOM attestation offline
        run: |
          R=dist/govcode-ci
          $R/bin/govcode attest verify -key "$RUNNER_TEMP/ci-release.pub" -bundle $R/provenance.intoto.jsonl -subject $R/bin/govcode
          $R/bin/govcode attest verify -key "$RUNNER_TEMP/ci-release.pub" -bundle $R/provenance.intoto.jsonl -subject $R/vscode/govcode-ci.vsix
          $R/bin/govcode attest verify -key "$RUNNER_TEMP/ci-release.pub" -bundle $R/sbom.intoto.jsonl -type sbom -subject $R/bin/govcode
          # A key that did not sign the release must be refused.
          go run ./cmd/govcode keygen -o "$RUNNER_TEMP/other.key"
          if $R/bin/govcode attest verify -key "$RUNNER_TEMP/other.pub" -bundle $R/provenance.intoto.jsonl -subject $R/bin/govcode; then exit 1; fi
      - name: two-person approval e2e with real OS users (GOV-41)
        # Creates alice/bob/carol on the disposable runner and drives the signed
        # release through propose, review, approve, audit and tamper checks.
        run: sudo bash scripts/e2e/two-person.sh dist/govcode-ci "$RUNNER_TEMP/ci-release.key"
      - name: RHEL RPM packaging (packaged binary must equal the signed one)
        run: |
          sudo apt-get install -y -qq rpm cpio selinux-policy-dev
          # Ubuntu has no RPM database for BuildRequires; the spec is built for real on a RHEL host.
          RPMBUILD_FLAGS=--nodeps scripts/build-rpm.sh dist/govcode-ci dist/rpm
          rpm -qlp dist/rpm/govcode-ci-1.x86_64.rpm | grep -qx /usr/bin/govcode
          rpm -qlp dist/rpm/govcode-selinux-ci-1.noarch.rpm | grep -qx /usr/share/selinux/packages/govcode.pp
          rpm -qlp dist/rpm/govcode-vscode-ci-1.noarch.rpm | grep -qx /usr/share/govcode/vscode/govcode-ci.vsix
          rpm -qp --scripts dist/rpm/govcode-ci-1.x86_64.rpm | grep -q 'chattr +a /var/lib/govcode/audit/log.jsonl'
