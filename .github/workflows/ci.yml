# Low-side CI only. The high side builds with scripts/build-release.sh.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - name: toolchains for the legacy eval tasks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnat gnucobol bubblewrap
      - name: allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: vet and test (offline module mode)
        env:
          GOPROXY: "off"
          GOFLAGS: "-mod=readonly"
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
      - name: reproducible release build
        run: |
          go run ./cmd/govcode keygen -o /tmp/ci-release.key
          scripts/build-release.sh ci /tmp/ci-release.key
